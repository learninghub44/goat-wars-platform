name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Fail if a secret-looking value leaked into the client bundle
        run: |
          ! grep -rEl "sk_(live|test)_|service_role|SUPABASE_SERVICE_ROLE_KEY|PAYSTACK_SECRET_KEY" dist
